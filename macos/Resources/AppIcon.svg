<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset="1" stop-color="#efe7d9"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece5d8"/>
      <stop offset="1" stop-color="#e3dacb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3c2d19" flood-opacity="0.28"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)"/>
  </g>
  <g clip-path="url(#sq)">
    <!-- 顶部标签：下划线 + 未保存圆点 -->
    <rect x="214" y="250" width="190" height="16" rx="8" fill="#b5452a"/>
    <rect x="452" y="250" width="120" height="16" rx="8" fill="#cfc6b6"/>
    <circle cx="790" cy="258" r="22" fill="#b5452a"/>
    <!-- 标题与正文 -->
    <rect x="214" y="338" width="430" height="46" rx="23" fill="#211d18"/>
    <rect x="214" y="434" width="596" height="22" rx="11" fill="#3b352d" opacity="0.55"/>
    <rect x="214" y="490" width="540" height="22" rx="11" fill="#3b352d" opacity="0.55"/>
    <rect x="214" y="546" width="380" height="22" rx="11" fill="#3b352d" opacity="0.55"/>
    <!-- 底部工具抽屉 -->
    <rect x="100" y="664" width="824" height="260" fill="url(#drawer)"/>
    <rect x="100" y="664" width="824" height="4" fill="#d6ccbb"/>
    <rect x="214" y="728" width="150" height="70" rx="20" fill="#b5452a"/>
    <rect x="388" y="728" width="150" height="70" rx="20" fill="none" stroke="#c9bfad" stroke-width="6"/>
    <rect x="562" y="728" width="150" height="70" rx="20" fill="none" stroke="#c9bfad" stroke-width="6"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="186" fill="none" stroke="#000" stroke-opacity="0.06" stroke-width="1"/>
</svg></body></html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="showMe 开发者百宝箱：JSON、XML、代码格式化，在线 API 调试，哈希加密等常用工具，全部在浏览器本地运行。" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>showMe · 开发者百宝箱</title>
    <script>
      // 在首帧前应用主题，避免闪烁
      try {
        var t = localStorage.getItem('theme.v1') || 'system';
        var host = document.documentElement.getAttribute('data-theme');
        var sys = host === 'dark' || host === 'light' ? host === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = t === 'dark' || (t === 'system' && sys);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
